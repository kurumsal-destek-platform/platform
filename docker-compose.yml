# Tek komutla tüm sistem:  docker compose up -d --build
# Adresler: uygulama http://localhost:5173 · API/Swagger http://localhost:5235/swagger · RAG http://localhost:8000/docs
#           Test e-postaları (Mailpit) http://localhost:8025
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    container_name: platform-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=platform;Username=platform;Password=platform
      Rag__Url: http://rag:8000
      Uploads__Path: /app/uploads
      # E-postalar gerçek kutulara değil Mailpit'e gider (http://localhost:8025)
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__Ssl: "false"
      Smtp__From: destek@platform.local
      App__FrontendUrl: http://localhost:5173
      Jwt__Key: ${JWT_KEY:-gelistirme-icin-en-az-32-karakterlik-gizli-anahtar-123}
    ports:
      - "5235:8080"
    volumes:
      - uploads:/app/uploads   # ekler konteyner yeniden kurulunca kaybolmasın

  # Sahte e-posta sunucusu: uygulamanın gönderdiği tüm mailleri web arayüzünde gösterir
  mailpit:
    image: axllent/mailpit:latest
    container_name: platform-mail
    restart: unless-stopped
    ports:
      - "8025:8025"   # web arayüzü
      - "1025:1025"   # SMTP (F5 ile çalıştırırken localhost:1025 kullanılır)

  rag:
    build: ./rag-service
    container_name: platform-rag
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://platform:platform@db:5432/platform
      # Ollama Docker'da değil, bilgisayarın kendisinde çalışır
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5235
    container_name: platform-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
  uploads:
