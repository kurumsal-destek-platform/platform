server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 110m;          # dosya ekleri (en fazla 100 MB)

    # API, canlı güncelleme (SignalR) ve API belgeleri aynı adresten: http://<sunucu>:5173/api/...
    # Böylece uygulama hangi bilgisayardan/IP'den açılırsa açılsın aynı sisteme bağlanır.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;        # asistan (yerel model) bazen uzun sürer
        proxy_request_buffering off;    # büyük ekler bellekte biriktirilmesin
    }
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }
    location ~ ^/(swagger|health) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Mailpit (demo e-posta kutusu): http://<sunucu>:5173/mail/
    location /mail/ {
        proxy_pass http://mailpit:8025;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # React Router: bilinmeyen adresler index.html'e gitsin (/projects/ANK gibi)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
