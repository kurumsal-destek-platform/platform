# Her PR'da ve main'e her gönderimde üç katmanın otomatik testleri çalışır.
# Testlerden biri kırmızıysa PR birleştirilmemeli (Settings → Rules'ta "testler" kontrolünü zorunlu yapın).
name: testler

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (xUnit)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet test tests/Platform.UnitTests --logger "console;verbosity=normal"

  rag:
    name: RAG servisi (pytest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: rag-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-tur
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  frontend:
    name: Frontend (tip kontrolü + vitest + derleme)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
